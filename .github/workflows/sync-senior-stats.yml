name: Sync 2026 senior statistics
on:
  workflow_dispatch:
  schedule:
    - cron: '45 3 * * *'
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate statistics
        env:
          PLAY_CRICKET_API_TOKEN: ${{ secrets.PLAY_CRICKET_API_TOKEN }}
          SEASON: '2026'
        run: node scripts/sync-senior-stats.mjs
      - name: Publish data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/senior-stats-2026.json
          if ! git diff --cached --quiet; then
            git commit -m "Update 2026 senior statistics"
            git push
          fi
